services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sp_project}
      POSTGRES_USER: ${POSTGRES_USER:-sp_project}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sp_project}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -v ON_ERROR_STOP=1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -c 'SELECT 1' >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    labels:
      log_source: sp-project-api
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-SP Project API}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sp_project}:${POSTGRES_PASSWORD:-sp_project}@db:5432/${POSTGRES_DB:-sp_project}
      REDIS_URL: redis://redis:6379/0
      AWS_SECRET_NAME: ${AWS_SECRET_NAME:-sp-project/jwt-secret}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_PROFILE: ${AWS_PROFILE:-default}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@example.com}
      TODO_NOTIFICATION_EMAIL: ${TODO_NOTIFICATION_EMAIL:-todo-notifications@example.com}
    volumes:
      - ./openapi.json:/app/openapi.json
      - type: bind
        source: ${AWS_CONFIG_DIR:-${USERPROFILE:-${HOME:-.}}/.aws}
        target: /root/.aws
        read_only: true
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.17.0}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-8.17.0}
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      XPACK_SECURITY_ENABLED: "false"
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:-sp-project-kibana-dev-key-not-for-production-2026}
    ports:
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  kibana-setup:
    image: python:3.13-alpine
    command: ["python", "/opt/provision_kibana.py"]
    environment:
      KIBANA_URL: http://kibana:5601
      ELASTICSEARCH_URL: http://elasticsearch:9200
      KIBANA_OBJECTS_FILE: /opt/kibana-objects.ndjson
    volumes:
      - ./deploy/elastic/provision_kibana.py:/opt/provision_kibana.py:ro
      - ./deploy/elastic/kibana-objects.ndjson:/opt/kibana-objects.ndjson:ro
    depends_on:
      kibana:
        condition: service_started
      filebeat:
        condition: service_started
    restart: "no"

  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELASTIC_VERSION:-8.17.0}
    user: root
    command: ["--strict.perms=false"]
    volumes:
      - ./deploy/elastic/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    environment:
      SWAGGER_JSON_URL: /openapi.json
    volumes:
      - ./openapi.json:/usr/share/nginx/html/openapi.json:ro
    expose:
      - "8080"
    restart: unless-stopped

  docs-proxy:
    build:
      context: ./deploy/swagger
    environment:
      DOCS_AUTH_USER: ${DOCS_AUTH_USER:?Set DOCS_AUTH_USER in .env}
      DOCS_AUTH_PASSWORD: ${DOCS_AUTH_PASSWORD:?Set DOCS_AUTH_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DOCS_PORT:-8081}:80"
    depends_on:
      swagger-ui:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"

volumes:
  postgres_data:
  elasticsearch_data:
