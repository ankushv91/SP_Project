filebeat.autodiscover:
  providers:
    - type: docker
      hints.enabled: false
      templates:
        - condition:
            equals:
              docker.container.labels.log_source: sp-project-api
          config:
            - type: filestream
              id: api-${data.docker.container.id}
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              parsers:
                - container:
                    stream: all
                    format: docker
              processors:
                - add_fields:
                    target: service
                    fields:
                      name: sp-project-api

processors:
  - add_docker_metadata:
      host: unix:///var/run/docker.sock

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]

setup.kibana:
  host: "http://kibana:5601"
