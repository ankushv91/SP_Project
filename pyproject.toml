[project]
name = "sp-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ankush", email = "ankushvidhate911@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.0",
    "greenlet>=3.5.6",
    "pwdlib[argon2]>=0.2.0",
    "pydantic-settings>=2.8.0",
    "pyjwt>=2.8.0",
    "sqlalchemy>=2.0",
]
[tool.uv]
package = false

[project.scripts]
sp-project = "sp_project:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
