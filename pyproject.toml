[project]
name = "sp-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ankush", email = "ankushvidhate911@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiosmtplib>=5.1.3",
    "asyncpg>=0.32.0",
    "boto3>=1.44.4",
    "fastapi[standard]>=0.162.0",
    "greenlet>=3.5.6",
    "pwdlib[argon2]>=0.2.0",
    "pydantic-settings>=2.8.0",
    "pyjwt>=2.8.0",
    "sqlalchemy>=2.0",
]
[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=81"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
